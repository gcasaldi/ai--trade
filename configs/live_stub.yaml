system:
  output_dir: outputs

dashboard:
  enabled: true

runtime:
  # Use the full orchestrator: it enforces long-only and sends advisory alerts.
  pipeline_mode: false

portfolio:
  # Liquid listed companies only: no ETFs, funds, crypto, leverage or shorting.
  instrument_type: equities
  symbols: [AAPL, MSFT, NVDA, GOOGL, META, AMZN, HD, PG, KO, JPM, V, JNJ, LLY, CAT, GE, XOM, CVX, LIN, NEM, NEE, DUK, AMT, PLD]
  sector_by_symbol:
    AAPL: Information Technology
    MSFT: Information Technology
    NVDA: Information Technology
    GOOGL: Communication Services
    META: Communication Services
    AMZN: Consumer Discretionary
    HD: Consumer Discretionary
    PG: Consumer Staples
    KO: Consumer Staples
    JPM: Financials
    V: Financials
    JNJ: Health Care
    LLY: Health Care
    CAT: Industrials
    GE: Industrials
    XOM: Energy
    CVX: Energy
    LIN: Materials
    NEM: Materials
    NEE: Utilities
    DUK: Utilities
    AMT: Real Estate
    PLD: Real Estate
  start_date: '2020-01-01'
  end_date: null
  lookback_days: 126
  max_weight: 0.25
  gross_limit: 0.75
  long_only: true
  rebalance_every_n_days: 21

costs:
  transaction_cost_bps: 5
  slippage_bps: 2

risk:
  target_annual_vol: 0.15
  min_annual_vol_floor: 0.10

agent:
  enable_ollama_overlay: false
  enable_llm_research: false
  ollama_model: llama3:latest
  ollama_url: http://localhost:11434/api/generate
  max_headlines: 8
  max_news_age_minutes: 15
  max_retries: 2
  retry_base_delay_sec: 0.4

strategies:
  weights:
    trend_following: 0.24
    mean_reversion: 0.12
    volatility_carry: 0.10
    regime_switching: 0.16
    event_driven: 0.08
    relative_strength_rotation: 0.20
    dual_momentum_gate: 0.15

alpha_pipeline:
  blend_weight: 0.0

arbitrage:
  blend_weight: 0.0

microstructure:
  blend_weight: 0.0
  enabled: true

research_council:
  # Cloud Actions has no local Ollama service; deterministic agents remain active.
  enabled: false
  blend_weight: 0.10
  max_rounds: 1
  request_timeout_sec: 90

learning:
  enabled: true
  decay: 0.95
  min_weight: 0.05
  dynamic_min_weight: 0.05
  dynamic_max_weight: 0.45
  dynamic_smoothing: 0.30
  quality_eval_days: 60

execution_controls:
  min_weight_change_to_trade: 0.02
  max_turnover_per_cycle: 0.40
  rebalance_cooldown_cycles: 1

private_alpha:
  blend_weight: 0.0

benchmark:
  mode: equal_weight
  symbol: AAPL
  alpha_weight: 0.20

fund_manager:
  turnover_penalty: 0.70
  risk_penalty_scale: 0.30
  top_k: 8

regime_controls:
  defensive_assets: []
  defensive_tilt: 0.00
  gross_limit_by_regime:
    trend: 1.00
    meanrev: 0.90
    stress: 0.60
  strategy_weights_by_regime:
    trend:
      trend_following: 0.55
      mean_reversion: 0.05
      volatility_carry: 0.05
      regime_switching: 0.25
      event_driven: 0.10
      relative_strength_rotation: 0.00
      dual_momentum_gate: 0.00
    meanrev:
      trend_following: 0.20
      mean_reversion: 0.35
      volatility_carry: 0.20
      regime_switching: 0.20
      event_driven: 0.05
      relative_strength_rotation: 0.00
      dual_momentum_gate: 0.00
    stress:
      trend_following: 0.05
      mean_reversion: 0.20
      volatility_carry: 0.40
      regime_switching: 0.30
      event_driven: 0.05
      relative_strength_rotation: 0.00
      dual_momentum_gate: 0.00

risk_hard_limits:
  max_weight: 0.30
  gross_limit: 1.00
  net_limit: 0.60
  max_annual_vol: 0.20
  drawdown_brake: 0.15
  brake_scale: 0.50
  var_limit_95: 0.03
  es_limit_95: 0.04
  concentration_top1_limit: 0.30
  concentration_top5_limit: 0.80
  beta_neutral_band: 0.99
  jump_threshold: 0.06
  max_leverage_by_regime:
    trend: 3.0
    meanrev: 2.5
    volatility_carry: 8.0
    stress: 1.0

data_quality:
  max_nan_ratio: 0.01
  max_abs_daily_return: 0.30
  max_zero_price_ratio: 0.0
  # yfinance supplies daily closes in this runtime, not exchange tick data.
  max_staleness_minutes: 2880

resilience:
  failure_threshold: 3
  recovery_timeout_sec: 120
  degraded_mode_enabled: true

health:
  deadman_timeout_sec: 900

alerts:
  enabled: true
  slack_webhook: ''
  email_to: ''
  smtp_host: smtp.gmail.com
  smtp_port: 587
  min_weight_change: 0.02
  reference_capital: 100.00
  stop_loss_pct: 0.02
  take_profit_pct: 0.04
  # Prudential estimate for Italian capital-gains tax; the broker statement prevails.
  estimated_tax_rate: 0.26
  commission_per_order: 1.00
  minimum_net_profit_pct: 0.02
  minimum_position_amount: 20.00
  thresholds:
    daily_pnl_drift: 0.03
    strategy_disagreement: 0.70

tracing:
  enabled: true

execution:
  broker: stub
  primary_broker: stub
  backup_brokers: [stub]
  market_mode: us
