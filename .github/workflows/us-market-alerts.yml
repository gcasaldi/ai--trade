name: US Market Telegram Alerts

on:
  workflow_dispatch:
    inputs:
      telegram_smoke_test:
        description: "Send a Telegram test message before running the strategy"
        required: false
        default: false
        type: boolean
  schedule:
    # Hourly coverage for 09:00-18:00 Europe/Rome across DST changes.
    - cron: "0 7-17 * * 1-5"

concurrency:
  group: us-market-telegram-alerts
  cancel-in-progress: false

jobs:
  analyze-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check advisory hours
        id: advisory_hours
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Europe/Rome date +%H)
          if [ "$hour" -ge 9 ] && [ "$hour" -lt 18 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.advisory_hours.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.advisory_hours.outputs.active == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        if: steps.advisory_hours.outputs.active == 'true'
        run: uv sync

      - name: Validate conservative advisor configuration
        if: steps.advisory_hours.outputs.active == 'true'
        run: |
          uv run python - <<'PY'
          from free_fund.config import load_config

          portfolio = load_config("configs/live_stub.yaml")["portfolio"]
          print({
              "long_only": portfolio.get("long_only"),
              "max_weight": portfolio.get("max_weight"),
              "gross_limit": portfolio.get("gross_limit"),
          })
          if portfolio.get("long_only") is not True:
              raise SystemExit("Safety check failed: advisor must be long-only")
          if float(portfolio.get("max_weight", 1.0)) > 0.25:
              raise SystemExit("Safety check failed: max weight exceeds 25%")
          if float(portfolio.get("gross_limit", 1.0)) > 0.75:
              raise SystemExit("Safety check failed: gross exposure exceeds 75%")
          PY

      - name: Validate Telegram secrets
        if: steps.advisory_hours.outputs.active == 'true'
        env:
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$ALERT_TELEGRAM_BOT_TOKEN" ] || [ -z "$ALERT_TELEGRAM_CHAT_ID" ]; then
            echo "Missing ALERT_TELEGRAM_BOT_TOKEN or ALERT_TELEGRAM_CHAT_ID in repository secrets."
            exit 1
          fi

      - name: Telegram smoke test (manual runs)
        if: ${{ steps.advisory_hours.outputs.active == 'true' && github.event_name == 'workflow_dispatch' && inputs.telegram_smoke_test }}
        env:
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
        run: |
          uv run python - <<'PY'
          import os
          import requests

          token = os.environ["ALERT_TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["ALERT_TELEGRAM_CHAT_ID"].strip()
          text = "[AI Hedge Fund] Telegram smoke test from GitHub Actions"
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": text},
              timeout=10,
          )
          response.raise_for_status()
          payload = response.json()
          if not payload.get("ok", False):
              raise SystemExit(f"Telegram API returned not ok: {payload}")
          print("Telegram smoke test sent successfully.")
          PY

      - name: Restore alert history
        if: steps.advisory_hours.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: outputs/alert_state.json
          key: telegram-alert-state-${{ github.run_id }}
          restore-keys: |
            telegram-alert-state-

      - name: Analyze market and send Telegram alerts
        if: steps.advisory_hours.outputs.active == 'true'
        env:
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
        run: uv run python scripts/run_daily.py --config configs/live_stub.yaml --dry-run
